<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vex Conquer Online 2D - Account Reservation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background: #05050a;
            color: #f0e6d2;
            overflow-x: hidden;
            position: relative;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: -8%;
            background: url('bg.jpg') center center / cover no-repeat;
            animation: bgKenBurns 28s ease-in-out infinite alternate;
            filter: brightness(0.52) contrast(1.12) saturate(1.2);
            transform-origin: center center;
        }

        @keyframes bgKenBurns {
            0%   { transform: scale(1.05) translate(0, 0); }
            50%  { transform: scale(1.13) translate(-1.5%, 1%); }
            100% { transform: scale(1.08) translate(1%, -1.5%); }
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 90% 70% at 50% 40%, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.62) 100%),
                linear-gradient(180deg, rgba(10,5,5,0.35) 0%, rgba(20,5,5,0.5) 40%, rgba(5,0,0,0.72) 100%);
            z-index: 1;
        }

        .bg-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 60%, rgba(180, 30, 20, 0.2) 0%, transparent 60%);
            z-index: 2;
            pointer-events: none;
            animation: glowPulse 7s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: #d4a84b;
            box-shadow: 0 0 6px #d4a84b, 0 0 12px rgba(212, 168, 75, 0.4);
            opacity: 0;
            animation: floatUp 14s infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            8% { opacity: 0.65; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-15vh) scale(1.2); opacity: 0; }
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.68) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 480px;
            margin: 0 auto;
            padding: 50px 20px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeDown 0.9s ease-out;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5e6b8 0%, #d4a84b 35%, #a67c00 70%, #d4a84b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: #c9a86c;
            font-weight: 600;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4a84b, transparent);
            margin: 14px auto 0;
            box-shadow: 0 0 12px rgba(212, 168, 75, 0.5);
        }

        .card {
            background: linear-gradient(160deg, rgba(18, 12, 20, 0.82), rgba(10, 6, 12, 0.9));
            border: 1px solid rgba(212, 168, 75, 0.28);
            border-radius: 18px;
            padding: 34px 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 168, 75, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: fadeUp 1s ease-out 0.15s both;
            position: relative;
            backdrop-filter: blur(14px);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 168, 75, 0.65), transparent);
        }

        .card-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #e8d5a0;
            margin-bottom: 26px;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 22px; }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #c9a86c;
            margin-bottom: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(8, 4, 8, 0.7);
            border: 1.5px solid rgba(212, 168, 75, 0.3);
            border-radius: 11px;
            color: #f5e6c8;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            outline: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            letter-spacing: 1.5px;
        }

        .input-wrapper input::placeholder {
            color: #6b5040;
            font-weight: 500;
            letter-spacing: 0;
        }

        .input-wrapper input:focus {
            border-color: #d4a84b;
            box-shadow: 0 0 0 4px rgba(212, 168, 75, 0.14), 0 0 25px rgba(212, 168, 75, 0.1);
            background: rgba(12, 6, 10, 0.85);
        }

        .btn-reserve {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4a84b 0%, #b8860b 45%, #8b6914 100%);
            border: none;
            border-radius: 11px;
            color: #1a1205;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(166, 124, 0, 0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .btn-reserve:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(166, 124, 0, 0.45);
            background: linear-gradient(135deg, #e0b84e 0%, #d4a84b 45%, #b8860b 100%);
        }

        .btn-reserve:active:not(:disabled) { transform: translateY(-1px); }
        .btn-reserve:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-reserve .shine {
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.55s ease;
        }

        .btn-reserve:hover:not(:disabled) .shine { left: 130%; }

        .message {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 9px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            display: none;
            animation: msgIn 0.35s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .message.success {
            display: block;
            background: rgba(20, 90, 45, 0.35);
            border: 1px solid rgba(50, 180, 90, 0.45);
            color: #7dffb0;
        }

        .message.error {
            display: block;
            background: rgba(120, 25, 25, 0.35);
            border: 1px solid rgba(220, 60, 60, 0.45);
            color: #ff8a8a;
        }

        .message.info {
            display: block;
            background: rgba(40, 70, 130, 0.35);
            border: 1px solid rgba(70, 130, 220, 0.45);
            color: #8ab4ff;
        }

        .counter-section {
            margin-top: 30px;
            text-align: center;
            animation: fadeUp 1.05s ease-out 0.25s both;
        }

        .counter-label {
            font-size: 0.85rem;
            color: #b89a6a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .counter-value {
            font-family: 'Cinzel', serif;
            font-size: 3.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f5e6b8, #d4a84b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            filter: drop-shadow(0 0 18px rgba(212, 168, 75, 0.3));
        }

        .counter-unit {
            font-size: 0.95rem;
            color: #8a7050;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .rewards {
            margin-top: 32px;
            animation: fadeUp 1.15s ease-out 0.35s both;
        }

        .rewards-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #d4a84b;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #7a6550;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .progress-bar {
            height: 5px;
            background: rgba(15, 8, 10, 0.85);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 168, 75, 0.15);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b6914, #d4a84b, #f0d78c);
            border-radius: 10px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 14px rgba(212, 168, 75, 0.55);
        }

        .reward-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 15px;
            background: rgba(10, 5, 8, 0.6);
            border: 1px solid rgba(212, 168, 75, 0.12);
            border-radius: 11px;
            margin-bottom: 9px;
            transition: all 0.35s ease;
            position: relative;
        }

        .reward-item.unlocked {
            border-color: rgba(212, 168, 75, 0.42);
            background: rgba(40, 25, 10, 0.5);
            box-shadow: 0 0 22px rgba(212, 168, 75, 0.1);
        }

        .reward-item.unlocked::after {
            content: '✓';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7dffb0;
            font-weight: 900;
            font-size: 1.15rem;
        }

        .reward-num {
            min-width: 46px;
            height: 46px;
            background: linear-gradient(145deg, #2a1a20, #151010);
            border: 1px solid rgba(212, 168, 75, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1rem;
            color: #d4a84b;
        }

        .reward-item.unlocked .reward-num {
            background: linear-gradient(145deg, #3d2e0c, #2a1f08);
            border-color: #d4a84b;
            color: #f0d78c;
            box-shadow: 0 0 12px rgba(212, 168, 75, 0.25);
        }

        .reward-text {
            flex: 1;
            font-size: 0.95rem;
            color: #b89a70;
            line-height: 1.35;
            font-weight: 600;
        }

        .reward-item.unlocked .reward-text { color: #e8d5a0; }

        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 0.78rem;
            color: #6a5540;
            letter-spacing: 1px;
            animation: fadeUp 1.25s ease-out 0.45s both;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .footer span { color: #d4a84b; font-weight: 600; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(26, 18, 5, 0.3);
            border-top-color: #1a1205;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .logo { font-size: 2rem; letter-spacing: 2px; }
            .card { padding: 26px 18px; }
            .counter-value { font-size: 2.8rem; }
            .container { padding: 30px 16px; }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
        <div class="bg-glow"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div class="vignette"></div>

    <div class="container">
        <div class="header">
            <div class="logo">Vex Conquer</div>
            <div class="subtitle">Online 2D</div>
            <div class="divider"></div>
        </div>

        <div class="card">
            <div class="card-title">Account Reservation</div>

            <div class="input-group">
                <label for="account">Account Name</label>
                <div class="input-wrapper">
                    <input type="text" id="account" placeholder="Enter your account name..." maxlength="50" autocomplete="off" spellcheck="false">
                </div>
            </div>

            <button class="btn-reserve" id="btnReserve">
                <span class="shine"></span>
                Reserve
            </button>

            <div class="message" id="message"></div>
        </div>

        <div class="counter-section">
            <div class="counter-label">Total Reserved Accounts</div>
            <div class="counter-value" id="counter">0</div>
            <div class="counter-unit">Accounts</div>
        </div>

        <div class="rewards">
            <div class="rewards-title">Milestone Rewards</div>
            
            <div class="progress-labels">
                <span>0</span>
                <span>25</span>
                <span>50</span>
                <span>100</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="reward-item" id="reward25">
                <div class="reward-num">25</div>
                <div class="reward-text">DB Scroll Gift</div>
            </div>
            <div class="reward-item" id="reward50">
                <div class="reward-num">50</div>
                <div class="reward-text">10 × Stone +3</div>
            </div>
            <div class="reward-item" id="reward100">
                <div class="reward-num">100</div>
                <div class="reward-text">DB Scroll ×2 + 20 × Stone +3</div>
            </div>
        </div>

        <div class="footer">
            <span>Vex Conquer Online 2D</span> — Secure Reservation System
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // ========== YOUR FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyBoGxX4SvH6dqvS1_D07GmHliTlrfaJTw8",
            authDomain: "store-754c5.firebaseapp.com",
            projectId: "store-754c5",
            storageBucket: "store-754c5.firebasestorage.app",
            messagingSenderId: "392118549414",
            appId: "1:392118549414:web:5abc5e61f041518f8ced67",
            measurementId: "G-WRW47QYCJ4"
        };
        // ==========================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const reservationsRef = db.collection("vex_reservations");

        const accountInput = document.getElementById('account');
        const btnReserve = document.getElementById('btnReserve');
        const messageEl = document.getElementById('message');
        const counterEl = document.getElementById('counter');
        const progressFill = document.getElementById('progressFill');

        function getDeviceId() {
            let id = localStorage.getItem('vex_device_id');
            if (!id) {
                id = 'vdev_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 12);
                localStorage.setItem('vex_device_id', id);
            }
            return id;
        }

        function hasReserved() {
            return localStorage.getItem('vex_reserved') === 'true';
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function updateUI(count) {
            counterEl.textContent = count;
            const percent = Math.min((count / 100) * 100, 100);
            progressFill.style.width = percent + '%';
            document.getElementById('reward25').classList.toggle('unlocked', count >= 25);
            document.getElementById('reward50').classList.toggle('unlocked', count >= 50);
            document.getElementById('reward100').classList.toggle('unlocked', count >= 100);
        }

        // Live counter
        reservationsRef.onSnapshot((snapshot) => {
            updateUI(snapshot.size);
        }, (err) => {
            console.error("Listen error:", err);
        });

        btnReserve.addEventListener('click', async () => {
            const account = accountInput.value.trim();

            if (!account) {
                showMessage('Please enter your account name', 'error');
                accountInput.focus();
                return;
            }
            if (account.length < 3) {
                showMessage('Account name is too short', 'error');
                return;
            }
            if (hasReserved()) {
                showMessage('This device has already reserved. One reservation per device only.', 'info');
                return;
            }

            btnReserve.disabled = true;
            btnReserve.innerHTML = 'Reserving <span class="spinner"></span>';

            try {
                const deviceId = getDeviceId();

                // Check if account already exists
                const accountQuery = await reservationsRef.where("account", "==", account).limit(1).get();
                if (!accountQuery.empty) {
                    showMessage('This account is already reserved', 'error');
                    btnReserve.disabled = false;
                    btnReserve.innerHTML = '<span class="shine"></span> Reserve';
                    return;
                }

                // Check if device already reserved
                const deviceQuery = await reservationsRef.where("deviceId", "==", deviceId).limit(1).get();
                if (!deviceQuery.empty) {
                    showMessage('This device has already reserved', 'error');
                    localStorage.setItem('vex_reserved', 'true');
                    btnReserve.disabled = false;
                    btnReserve.innerHTML = '<span class="shine"></span> Reserve';
                    return;
                }

                // Add reservation
                await reservationsRef.add({
                    account: account,
                    deviceId: deviceId,
                    time: firebase.firestore.FieldValue.serverTimestamp(),
                    userAgent: navigator.userAgent.substring(0, 120)
                });

                localStorage.setItem('vex_reserved', 'true');
                showMessage('Reservation successful! Wait for the rewards 🎉', 'success');
                accountInput.value = '';
                accountInput.disabled = true;
                btnReserve.innerHTML = 'Reserved ✓';

            } catch (err) {
                console.error(err);
                showMessage('Something went wrong, please try again', 'error');
                btnReserve.disabled = false;
                btnReserve.innerHTML = '<span class="shine"></span> Reserve';
            }
        });

        accountInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnReserve.click();
        });

        if (hasReserved()) {
            accountInput.disabled = true;
            btnReserve.disabled = true;
            btnReserve.innerHTML = 'Already Reserved ✓';
            showMessage('This device has already reserved', 'info');
        }

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 28; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 14 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            const size = 2 + Math.random() * 3;
            p.style.width = p.style.height = size + 'px';
            particlesContainer.appendChild(p);
        }
    </script>
</body>
</html>
